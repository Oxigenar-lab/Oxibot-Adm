<style>
  :root{
    --bg:#f4f7fb;
    --paper:#f9fbfd;
    --sidebar:#ffffff;
    --card:#ffffff;
    --ink:#1e293b;
    --ink-soft:#6b778c;
    --line:#e5eaf1;
    --teal:#0c9bb8;
    --teal-soft:rgba(12,155,184,.09);
    --teal-line:rgba(12,155,184,.28);
    --accent:#6d5de8;
    --warn:#8a5a00;
    --warn-bg:#fff8e8;
    --warn-line:#f3e0b0;
    --miss-bg:#fff5f6;
    --miss-line:#f6d3d8;
    --miss-ink:#a33a4d;
    --shadow:0 1px 2px rgba(30,41,59,.05), 0 4px 14px rgba(30,41,59,.04);
    --user-ink:#ffffff;
    --canvas-bg:#ffffff;
    --grid:rgba(12,155,184,.06);
    --glow-a:rgba(109,93,232,.07);
    --glow-b:rgba(12,155,184,.07);
  }
  :root[data-theme="dark"]{
    --bg:#0d1220;
    --paper:#0f1526;
    --sidebar:#0b101d;
    --card:#151c30;
    --ink:#e6ecf5;
    --ink-soft:#8d99b0;
    --line:#222c45;
    --teal:#35d0ec;
    --teal-soft:rgba(53,208,236,.1);
    --teal-line:rgba(53,208,236,.3);
    --accent:#8a79ff;
    --warn:#f1bd5a;
    --warn-bg:rgba(241,189,90,.09);
    --warn-line:rgba(241,189,90,.25);
    --miss-bg:#201320;
    --miss-line:#4a2430;
    --miss-ink:#ff9aae;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --user-ink:#06121a;
    --grid:rgba(53,208,236,.055);
    --glow-a:rgba(138,121,255,.09);
    --glow-b:rgba(53,208,236,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    font-family:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%; height:100vh; display:flex; overflow:hidden; background:var(--paper);}

  /* ===== Sidebar ===== */
  .sidebar{
    width:268px; flex-shrink:0; background:var(--sidebar);
    display:flex; flex-direction:column;
    border-right:1px solid var(--line);
  }
  .sidebar-brand{padding:26px 22px 18px; display:flex; align-items:center; gap:12px;}
  .sidebar-brand img{width:42px;height:42px;border-radius:50%; border:1px solid var(--teal-line); box-shadow:0 0 0 4px var(--teal-soft);}
  .sidebar-brand .name{font-family:'Sora','DM Sans',sans-serif; font-size:1.02rem; font-weight:700; letter-spacing:.09em; line-height:1.1;
    background:linear-gradient(90deg,var(--ink) 30%,var(--teal)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sidebar-brand .role{font-size:.72rem; color:var(--ink-soft); margin-top:3px;}
  .side-search{padding:4px 18px 14px;}
  .side-search input{
    width:100%; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:10px; padding:9px 12px; font-size:.82rem; outline:none; font-family:inherit;
  }
  .side-search input:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  .sidebar h2{
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.64rem; text-transform:uppercase; letter-spacing:.14em;
    color:var(--ink-soft); margin:20px 22px 10px; font-weight:600;
  }
  .sidebar-list{overflow-y:auto; flex:1; min-height:0; padding:0 12px 14px;}
  .sidebar-list::-webkit-scrollbar, .messages::-webkit-scrollbar{width:8px;}
  .sidebar-list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  .side-btn{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--ink-soft); padding:10px 14px; border-radius:10px;
    font-size:.84rem; cursor:pointer; margin-bottom:3px; line-height:1.45; font-family:inherit;
    transition:background .15s ease,color .15s ease;
  }
  .side-btn:hover{background:var(--teal-soft); color:var(--ink);}
  .side-btn{position:relative;}
  .side-btn.active{background:var(--teal-soft); color:var(--teal); font-weight:600;}
  .side-btn.active::before{content:""; position:absolute; left:0; top:20%; bottom:20%; width:3px; border-radius:3px; background:linear-gradient(180deg,var(--teal),var(--accent));}
  .side-empty{padding:10px 12px; font-size:.8rem; color:var(--ink-soft);}
  .side-foot{padding:14px 22px; border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-soft);}

  @media (max-width:760px){
    .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:20; transform:translateX(-100%);
      transition:transform .25s ease; box-shadow:none;}
    .sidebar.open{transform:translateX(0); box-shadow:10px 0 30px rgba(0,0,0,.18);}
  }

  /* ===== Chat column ===== */
  .chat-col{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--paper);}
  header{
    position:relative;
    background:var(--sidebar); padding:16px 26px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line);
  }
  .menu-btn{
    display:none; background:var(--teal-soft); border:1px solid var(--teal-line); color:var(--teal);
    width:36px;height:36px;border-radius:10px;font-size:1rem;cursor:pointer;flex-shrink:0;
  }
  
  .avatar-img{width:42px;height:42px;border-radius:50%;border:1px solid var(--teal-line);flex-shrink:0; box-shadow:0 0 0 4px var(--teal-soft);}
  header::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--teal),var(--accent),transparent); opacity:.7;}
  .header-text{flex:1; min-width:0;}
  header h1{margin:0; font-family:'Sora','DM Sans',sans-serif; font-size:1.15rem; font-weight:700; letter-spacing:.1em;
    background:linear-gradient(90deg,var(--ink) 35%,var(--teal) 75%,var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .status{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-soft);margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .status .dot{width:7px;height:7px;border-radius:50%; background:#2fbf71; display:inline-block; flex-shrink:0; animation:pulso 2.4s ease-in-out infinite;}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(47,191,113,.5);} 70%{box-shadow:0 0 0 6px rgba(47,191,113,0);} 100%{box-shadow:0 0 0 0 rgba(47,191,113,0);}}
  .updated{
    display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.66rem; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:3px 10px; margin-top:5px;
  }
  .head-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    height:36px; min-width:36px; padding:0 11px; border-radius:10px; cursor:pointer; font-size:.85rem; font-family:inherit;
    transition:all .15s ease;
  }
  .icon-btn:hover{color:var(--teal); border-color:var(--teal-line); background:var(--teal-soft);}
  @media (max-width:760px){ .icon-btn .lbl{display:none;} }

  .messages{
    background-color:var(--paper);
    background-image:
      radial-gradient(900px 420px at 100% 0%, var(--glow-a), transparent 65%),
      radial-gradient(800px 420px at 0% 100%, var(--glow-b), transparent 65%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:auto, auto, 44px 44px, 44px 44px;
    background-attachment:local, local, local, local;
    flex:1; overflow-y:auto; padding:30px 32px 16px; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth;}
  .row{display:flex; align-items:flex-end; gap:12px; margin:12px 0; animation:surge .25s ease both;}
  @keyframes surge{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .row.user{justify-content:flex-end;}
  .row .mini-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;border:1px solid var(--line);}
  .row.miss .mini-avatar{filter:grayscale(.5);}
  .bubble-wrap{display:flex; flex-direction:column; max-width:min(78%,820px);}
  .row.user .bubble-wrap{align-items:flex-end;}
  .bubble{padding:18px 22px; border-radius:18px; font-size:.95rem; line-height:1.75;}
  .row.bot .bubble{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px; box-shadow:var(--shadow);}
  .row.miss .bubble{background:var(--miss-bg); border:1px solid var(--miss-line); color:var(--miss-ink); border-bottom-left-radius:6px;}
  .row.user .bubble{background:linear-gradient(135deg,var(--teal),var(--accent)); color:var(--user-ink); font-weight:500; border-bottom-right-radius:6px;}
  .timestamp{font-size:.7rem; color:var(--ink-soft); margin-top:6px; padding:0 8px;}

  .bubble h3{margin:22px 0 8px; font-family:'Sora','DM Sans',sans-serif; font-size:.98rem; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:9px;}
  .bubble h3::before{content:""; width:4px; height:16px; border-radius:3px; flex-shrink:0; background:linear-gradient(180deg,var(--teal),var(--accent));}
  .bubble h3:first-child, .bubble .tag + h3{margin-top:2px;}
  .bubble p{margin:10px 0;}
  .bubble ol, .bubble ul{margin:10px 0; padding-left:24px;}
  .bubble li{margin:7px 0; padding-left:2px;}
  .bubble li > ul, .bubble li > ol{margin:6px 0 4px;}
  .bubble > :first-child{margin-top:0;}
  .bubble > :last-child{margin-bottom:0;}
  .bubble a{color:var(--teal);}
  .bubble .note{
    margin-top:16px; padding:13px 16px; background:var(--warn-bg); color:var(--warn);
    border-radius:12px; font-size:.88rem; line-height:1.65; border:1px solid var(--warn-line);
  }
  .bubble .tag, .bubble .rephrase-tag{
    display:inline-block; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.66rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase;
    color:var(--teal); background:var(--teal-soft); padding:4px 12px; border-radius:20px; margin-bottom:10px;
    border:1px solid var(--teal-line);
  }
  .bubble .fuzzy-note{margin:0 0 8px; font-size:.8rem; font-style:italic; color:var(--ink-soft);}
  .suggest-list{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .suggest-btn, .action-chip{
    background:var(--card); color:var(--teal); border:1px solid var(--teal-line); border-radius:20px;
    padding:8px 16px; font-size:.82rem; font-weight:500; cursor:pointer; font-family:inherit;
    transition:all .15s ease;
  }
  .suggest-btn:hover, .action-chip:hover{background:var(--teal-soft); transform:translateY(-1px);}
  .followup{display:flex; flex-wrap:wrap; gap:9px; margin:12px 0 0 8px; align-items:center;}
  .followup .lbl{font-size:.72rem; color:var(--ink-soft); margin-right:2px;}
  .followup .action-chip{padding:5px 12px; font-size:.77rem; color:var(--ink-soft); border-color:var(--line);}
  .followup .action-chip:hover{color:var(--teal); border-color:var(--teal-line);}
  .typing-row .bubble{display:flex; gap:4px; align-items:center; padding:13px 16px;}
  .typing-dot{width:6px;height:6px;border-radius:50%; background:var(--teal); animation:blink 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .live-suggest{display:none; flex-wrap:wrap; gap:8px; padding:12px 26px 0; background:var(--sidebar); align-items:center;}
  .live-suggest.show{display:flex;}
  .live-suggest .lbl{font-size:.72rem; color:var(--ink-soft);}
  form{display:flex; gap:12px; padding:16px 26px 22px; background:var(--sidebar);}
  .live-suggest.show + form{padding-top:10px;}
  input[type=text]{
    flex:1; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:26px; padding:14px 20px; font-size:.95rem; outline:none; font-family:inherit;
  }
  input[type=text]::placeholder{color:var(--ink-soft);}
  input[type=text]:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  button.send{
    width:48px; height:48px; background:linear-gradient(135deg,var(--teal),var(--accent)); color:#fff;
    border:none; border-radius:50%; font-size:1rem; cursor:pointer; flex-shrink:0;
    transition:transform .15s ease, filter .15s ease;
  }
  button.send:hover{filter:brightness(1.08); transform:scale(1.05);}

  .mini-calc{margin-top:16px; padding:18px; background:var(--paper); border:1px solid var(--line); border-radius:12px;}
  .mini-calc label{display:block; font-size:.84rem; color:var(--ink-soft); margin-bottom:16px;}
  .mini-calc label:last-of-type{margin-bottom:12px;}
  .mini-calc input, .mini-calc select{
    display:block; width:100%; margin-top:4px; background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px 13px; font-size:.9rem; outline:none; font-family:inherit;
  }
  .mini-calc input:focus, .mini-calc select:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  .mini-calc .calc-btn, .mini-calc .calc-btn-secondary{margin-top:4px;}
  .mini-calc .calc-btn{
    background:linear-gradient(135deg,var(--teal),var(--accent)); color:#fff; border:none; border-radius:9px;
    padding:9px 18px; font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .mini-calc .calc-btn:hover{filter:brightness(1.08);}
  .mini-calc .calc-btn-secondary{
    background:transparent; color:var(--teal); border:1px solid var(--teal-line); border-radius:9px;
    padding:8px 14px; font-size:.82rem; font-weight:500; cursor:pointer; margin-right:8px; font-family:inherit;
  }
  .mini-calc .calc-btn-secondary:hover{background:var(--teal-soft);}
  .mini-calc .vt-assinatura-pad{
    display:block; width:100%; max-width:300px; height:120px; background:#ffffff;
    border:1px solid var(--line); border-radius:9px; margin-top:4px; cursor:crosshair; touch-action:none;
  }
  .mini-calc .calc-error{margin-top:8px; color:var(--miss-ink); font-size:.82rem;}
  .overlay{display:none; position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:15;}
  .overlay.show{display:block;}

  /* ===== Celular (fica por último para valer sobre as regras acima) ===== */
  @media (max-width:760px){
    .menu-btn{display:block;}
    .messages{padding:20px 14px 10px;}
    .bubble{padding:15px 17px;}
    .row.bot .mini-avatar, .row.miss .mini-avatar{display:none;}
    .bubble-wrap{max-width:100%;}
    .row.bot .bubble-wrap, .row.miss .bubble-wrap{width:100%;}
    .row.user .bubble-wrap{max-width:88%;}
    .status{display:none;}
    .followup{margin-left:0;}
    header{padding:14px 16px;}
    form{padding:12px 14px 16px;}
  }
</style>

</head>

/* ========================= CALCULADORA DE CANCELAMENTO DE PLANO ========================= */
function formatarMoeda(valor){
  return "R$ " + valor.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseValorMonetario(str){
  // Aceita "1200,00", "1200.00", "1.200,00" — sempre tratando vírgula como decimal quando presente
  const limpo = str.trim().replace(/\s/g,"");
  if(limpo.includes(",")){
    return parseFloat(limpo.replace(/\./g,"").replace(",", "."));
  }
  return parseFloat(limpo);
}

function mesesEntreDatas(inicio, fim){
  let meses = (fim.getFullYear() - inicio.getFullYear()) * 12 + (fim.getMonth() - inicio.getMonth());
  if(fim.getDate() < inicio.getDate()) meses -= 1;
  return Math.max(0, meses);
}

function explicarContagemMeses(inicio, fim, mesesUsados){
  const fmt = d => d.toLocaleDateString("pt-BR");
  const diaInicio = inicio.getDate();
  const diaFim = fim.getDate();
  const mesesCalendario = (fim.getFullYear() - inicio.getFullYear()) * 12 + (fim.getMonth() - inicio.getMonth());
  const plural = n => n === 1 ? "mês" : "meses";
  const viradas = n => n === 1 ? "1 virada de mês" : `${n} viradas de mês`;

  if(diaFim >= diaInicio){
    return `Contamos <b>${mesesUsados} ${plural(mesesUsados)}</b> porque cada mês do plano "fecha" sempre no dia <b>${diaInicio}</b> (o mesmo dia do início, ${fmt(inicio)}). Entre ${fmt(inicio)} e ${fmt(fim)} houve ${viradas(mesesCalendario)}, e como o dia final (${diaFim}) já alcançou o dia ${diaInicio}, esse último mês também fechou completo — por isso o total é ${mesesUsados}.`;
  }
  return `Contamos <b>${mesesUsados} ${plural(mesesUsados)}</b> porque cada mês do plano "fecha" sempre no dia <b>${diaInicio}</b> (o mesmo dia do início, ${fmt(inicio)}). Entre ${fmt(inicio)} e ${fmt(fim)} houve ${viradas(mesesCalendario)}, mas o dia final (${diaFim}) ainda não chegou no dia ${diaInicio} desse último mês — ou seja, esse último mês começou mas não fechou um ciclo completo, então ele não entra na contagem. Por isso o total é ${mesesUsados}.`;
}

function calcularRompimento(btn){
  const wrap = btn.closest(".mini-calc");
  const mesesPlano = parseInt(wrap.querySelector(".c-meses-plano").value, 10);
  const valorTotal = parseValorMonetario(wrap.querySelector(".c-valor-total").value || "");
  const dataInicioStr = wrap.querySelector(".c-data-inicio").value;
  const dataFimStr = wrap.querySelector(".c-data-fim").value;

  let erroEl = wrap.querySelector(".calc-error");
  if(erroEl) erroEl.remove();

  function mostrarErro(msg){
    const e = document.createElement("div");
    e.className = "calc-error";
    e.textContent = msg;
    wrap.appendChild(e);
  }

  if(!mesesPlano || mesesPlano <= 0){ mostrarErro("Informe quantos meses tem o plano."); return; }
  if(!valorTotal || isNaN(valorTotal) || valorTotal <= 0){ mostrarErro("Informe o valor total do plano."); return; }
  if(!dataInicioStr || !dataFimStr){ mostrarErro("Informe as duas datas (início e finalização)."); return; }

  const dataInicio = new Date(dataInicioStr + "T00:00:00");
  const dataFim = new Date(dataFimStr + "T00:00:00");
  if(dataFim < dataInicio){ mostrarErro("A data de finalização não pode ser anterior à data de início."); return; }

  const mesesUsados = mesesEntreDatas(dataInicio, dataFim);

  if(mesesUsados > mesesPlano){
    addBotBubble(`<span class="tag">Cálculo de Multa</span><br>Erro: os meses utilizados (${mesesUsados}) não podem ser maiores que o total do plano (${mesesPlano}).`);
    return;
  }

  const valorMensal = valorTotal / mesesPlano;
  const mensalidadesUtilizadas = valorMensal * mesesUsados;
  const mensalidadesRestantes = valorTotal - mensalidadesUtilizadas;
  const multa = mensalidadesRestantes * 0.3;
  const valorDevolvido = valorTotal - multa - mensalidadesUtilizadas;

  addBotBubble(`
    <span class="tag">Cálculo de Multa</span>
    <h3>Resultado do Cancelamento</h3>
    <p>Meses utilizados (calculado pelas datas): <b>${mesesUsados}</b> de <b>${mesesPlano}</b> meses do plano.</p>
    <div class="note">${explicarContagemMeses(dataInicio, dataFim, mesesUsados)}</div>
    <ul>
      <li>Mensalidades utilizadas = <b>${formatarMoeda(mensalidadesUtilizadas)}</b></li>
      <li>Mensalidades restantes = <b>${formatarMoeda(mensalidadesRestantes)}</b></li>
      <li>Multa (30% em cima do restante) = <b>${formatarMoeda(multa)}</b></li>
      <li>Valor pago: <b>${formatarMoeda(valorTotal)}</b></li>
    </ul>
    <div class="note">Valor a ser devolvido = valor pago − multa − mensalidades utilizadas<br>
      <b>Valor a ser devolvido = ${formatarMoeda(valorDevolvido)}</b></div>
  `);
}

  const [ano, mes] = str.split("-");
  return MESES_PT[parseInt(mes, 10) - 1] + "/" + ano;
}

/* ---- Conversor de valor monetário para texto por extenso (pt-BR) ---- */
const UNIDADES_EXT = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove"];
const DEZ_A_DEZENOVE_EXT = ["dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZENAS_EXT = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CENTENAS_EXT = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];

function centenaPorExtenso(n){
  if(n === 0) return "";
  if(n === 100) return "cem";
  const c = Math.floor(n/100);
  const resto = n % 100;
  const partes = [];
  if(c > 0) partes.push(CENTENAS_EXT[c]);
  if(resto > 0){
    if(resto < 10) partes.push(UNIDADES_EXT[resto]);
    else if(resto < 20) partes.push(DEZ_A_DEZENOVE_EXT[resto-10]);
    else {
      const d = Math.floor(resto/10);
      const u = resto % 10;
      partes.push(u > 0 ? (DEZENAS_EXT[d] + " e " + UNIDADES_EXT[u]) : DEZENAS_EXT[d]);
    }
  }
  return partes.join(" e ");
}

function numeroPorExtenso(n){
  if(n === 0) return "zero";
  const milhar = Math.floor(n/1000);
  const resto = n % 1000;
  const partes = [];
  if(milhar > 0){
    partes.push(milhar === 1 ? "mil" : (centenaPorExtenso(milhar) + " mil"));
  }
  if(resto > 0){
    const precisaE = milhar > 0 && (resto < 100 || resto % 100 === 0);
    partes.push(precisaE ? ("e " + centenaPorExtenso(resto)) : centenaPorExtenso(resto));
  }
  return partes.join(" ");
}

function valorPorExtenso(valor){
  const reais = Math.floor(valor + 1e-9);
  const centavos = Math.round((valor - reais) * 100);
  let texto = numeroPorExtenso(reais) + " " + (reais === 1 ? "real" : "reais");
  if(centavos > 0){
    texto += " e " + numeroPorExtenso(centavos) + " " + (centavos === 1 ? "centavo" : "centavos");
  }
  return texto;
}

function formatarDataPorExtenso(dataStr){
  const d = new Date(dataStr + "T00:00:00");
  return `${d.getDate()} de ${MESES_PT[d.getMonth()]} de ${d.getFullYear()}`;
}

/* ---- Assinatura desenhada à mão (canvas) ---- */
function initSignaturePads(container){
  container.querySelectorAll(".vt-assinatura-pad").forEach(canvas=>{
    if(canvas.dataset.initialized) return;
    canvas.dataset.initialized = "1";
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    let desenhando = false, ultimoX = 0, ultimoY = 0;

    function posicao(e){
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }
    function iniciar(e){
      desenhando = true;
      canvas.dataset.hasSignature = "1";
      const p = posicao(e);
      ultimoX = p.x; ultimoY = p.y;
      e.preventDefault();
    }
    function desenhar(e){
      if(!desenhando) return;
      const p = posicao(e);
      ctx.beginPath();
      ctx.moveTo(ultimoX, ultimoY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ultimoX = p.x; ultimoY = p.y;
      e.preventDefault();
    }
    function parar(){ desenhando = false; }

    canvas.addEventListener("mousedown", iniciar);
    canvas.addEventListener("mousemove", desenhar);
    window.addEventListener("mouseup", parar);
    canvas.addEventListener("touchstart", iniciar, { passive: false });
    canvas.addEventListener("touchmove", desenhar, { passive: false });
    canvas.addEventListener("touchend", parar);
  });
}

function limparAssinatura(btn){
  const canvas = btn.closest(".mini-calc").querySelector(".vt-assinatura-pad");
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.hasSignature = "";
}

  const wrap = btn.closest(".mini-calc");
  const nome = wrap.querySelector(".vt-nome").value.trim();
  const cpf = wrap.querySelector(".vt-cpf").value.trim();
  const mesStr = wrap.querySelector(".vt-mes").value;
  const dias = parseInt(wrap.querySelector(".vt-dias").value, 10);
  const valorDiario = parseValorMonetario(wrap.querySelector(".vt-valor-diario").value || "");
  const cidade = wrap.querySelector(".vt-cidade").value.trim() || "Volta Redonda";

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function matchesAny(qNorm, list){
  return list.some(p => qNorm.includes(normalize(p)));
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ---- Distância de edição (Levenshtein), para tolerar erros de digitação ---- */
function levenshtein(a, b){
  if(a === b) return 0;
  const al = a.length, bl = b.length;
  if(al === 0) return bl;
  if(bl === 0) return al;
  const d = [];
  for(let i = 0; i <= al; i++){ d[i] = [i]; }
  for(let j = 0; j <= bl; j++){ d[0][j] = j; }
  for(let i = 1; i <= al; i++){
    for(let j = 1; j <= bl; j++){
      const custo = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + custo);
      // letras trocadas de lugar (ex.: "bonifiacao") contam como um erro só
      if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
      }
    }
  }
  return d[al][bl];
}
function limiteErroDigitacao(len){
  if(len <= 3) return 0;
  if(len <= 5) return 1;
  if(len <= 9) return 2;
  return 3;
}
function palavraAproximada(palavrasDaBusca, palavraAlvo){
  const limite = limiteErroDigitacao(palavraAlvo.length);
  for(const w of palavrasDaBusca){
    // palavra digitada pela metade (ex.: "bonific", "recolh")
    if(w.length >= 5 && palavraAlvo.length > w.length && palavraAlvo.startsWith(w)) return true;
    if(Math.abs(w.length - palavraAlvo.length) <= limite && levenshtein(w, palavraAlvo) <= limite){
      return true;
    }
  }
  return false;
}

/* ---- Pontuação de cada entrada da base, com correção de digitação ----
   exactScore: correspondências exatas (substring), pesam mais.
   fuzzyScore: correspondências aproximadas (com erro de digitação), pesam menos. */
/* Palavras muito comuns do português (artigos, pronomes, interrogativos) que nunca devem
   contar ponto — senão qualquer frase com "qual", "como", "para" etc. bateria com algo */
const STOPWORDS = new Set([
  "qual","quais","como","onde","quando","porque","por","que","para","com","sem",
  "uma","um","dos","das","este","esta","isso","aquilo","voce","você","tem","fazer",
  "quero","preciso","favor","pode","poderia","sobre","desse","dessa","deste","desta",
  "nao","não","sim","aqui","ali","meu","minha","seu","sua","muito","pouco","mais","menos"
]);

/* Palavras muito genéricas, que aparecem em vários processos diferentes — contam menos,
   pra não fazer um processo "roubar" a resposta de outro só por compartilhar um termo comum */
const PALAVRAS_GENERICAS = new Set([
  "equipamento","equipamentos","cliente","processo","sistema","unidade","nota","venda","vendas",
  "portal","tela","produto","produtos","contrato","servico","serviço","assistencia","assistência",
  "empresa","valor","numero","número","forma","documento","documentos","pagamento"
]);
function pesoPalavra(w){ return PALAVRAS_GENERICAS.has(w) ? 0.4 : 1; }

function scoreEntry(entry, queryNorm){
  const queryWords = queryNorm.split(" ").filter(Boolean);
  let exactScore = 0, fuzzyScore = 0;

  // Bônus por frase-chave inteira encontrada (mantém peso maior para frases completas)
  for(const kw of entry.keywords){
    const kwNorm = normalize(kw);
    if(kwNorm && queryNorm.includes(kwNorm)){
      exactScore += kwNorm.split(" ").length * 3;
    }
  }

  // Palavras coladas ou separadas por engano (ex.: "notafiscal", "bonifi cacao")
  const querySemEspaco = queryNorm.replace(/ /g, "");
  for(const kw of entry.keywords){
    const kwSem = normalize(kw).replace(/ /g, "");
    if(kwSem.length >= 6 && !queryNorm.includes(normalize(kw)) && querySemEspaco.includes(kwSem)){
      fuzzyScore += 2;
      break;
    }
  }

  // Palavras relevantes únicas (evita contar a mesma palavra várias vezes só porque
  // ela aparece repetida em diferentes frases-chave da mesma entrada, e ignora stopwords)
  const palavrasRelevantes = new Set();
  entry.keywords.forEach(kw => {
    normalize(kw).split(" ").forEach(w => { if(w.length > 2 && !STOPWORDS.has(w)) palavrasRelevantes.add(w); });
  });
  normalize(entry.title).split(" ").forEach(w => { if(w.length > 3 && !STOPWORDS.has(w)) palavrasRelevantes.add(w); });

  palavrasRelevantes.forEach(w => {
    const peso = pesoPalavra(w);
    if(queryNorm.includes(w)) exactScore += 1 * peso;
    else if(palavraAproximada(queryWords, w)) fuzzyScore += 1 * peso;
  });

  return { entry, exactScore, fuzzyScore, total: exactScore + fuzzyScore };
}

/* ---- Vocabulário do bot e correção automática de palavras digitadas errado ---- */
const VOCAB = (()=>{
  const set = new Set();
  KNOWLEDGE_BASE.forEach(e=>{
    e.keywords.forEach(kw => normalize(kw).split(" ").forEach(w => { if(w.length >= 4 && !STOPWORDS.has(w)) set.add(w); }));
    normalize(e.title).split(" ").forEach(w => { if(w.length >= 4 && !STOPWORDS.has(w)) set.add(w); });
  });
  return [...set];
})();

/* Troca cada palavra que não existe no vocabulário pela mais parecida (se for parecida o bastante) */
function corrigirConsulta(qNorm){
  const trocas = [];
  const palavras = qNorm.split(" ").map(w=>{
    if(w.length < 4 || STOPWORDS.has(w) || /\d/.test(w)) return w;
    if(VOCAB.includes(w)) return w;
    if(w.length >= 5 && VOCAB.some(v => v.startsWith(w))) return w;     // palavra incompleta: deixa a busca tratar
    const limite = limiteErroDigitacao(w.length);
    let melhor = null, melhorDist = Infinity;
    for(const v of VOCAB){
      if(Math.abs(v.length - w.length) > limite) continue;
      const dist = levenshtein(w, v);
      if(dist <= limite && dist < melhorDist){ melhor = v; melhorDist = dist; }
    }
    if(melhor){ trocas.push([w, melhor]); return melhor; }
    return w;
  });
  return { texto: palavras.join(" "), trocas };
}

/* Último recurso: quando nada bateu, procura os temas com palavras "parecidas" com o que foi digitado */
function sugestoesParecidas(qNorm){
  const palavras = qNorm.split(" ").filter(w => w.length >= 5 && !STOPWORDS.has(w));
  if(!palavras.length) return [];
  return KNOWLEDGE_BASE.map(entry=>{
    const alvo = new Set();
    entry.keywords.forEach(kw => normalize(kw).split(" ").forEach(w => { if(w.length >= 5 && !STOPWORDS.has(w)) alvo.add(w); }));
    normalize(entry.title).split(" ").forEach(w => { if(w.length >= 5 && !STOPWORDS.has(w)) alvo.add(w); });
    let melhor = 0;
    palavras.forEach(q => alvo.forEach(a=>{
      const sim = 1 - levenshtein(q, a) / Math.max(q.length, a.length);
      if(sim > melhor) melhor = sim;
    }));
    return { entry, total: melhor };
  }).filter(x => x.total >= 0.7).sort((a,b)=>b.total-a.total).slice(0,3);
}

/* Retorna a lista de candidatos ordenada por pontuação (do mais provável ao menos provável) */
function findAnswer(query){
  const qNorm = normalize(query);
  return KNOWLEDGE_BASE
    .map(entry => scoreEntry(entry, qNorm))
    .filter(x => x.total >= 1)
    .sort((a, b) => b.total - a.total);
}

/* ---- Explicação "de outro jeito", gerada a partir do próprio conteúdo (resumo + tópicos) ---- */
function explicarDeOutroJeito(entry){
  const temp = document.createElement("div");
  temp.innerHTML = entry.html;
  const paragrafos = [...temp.querySelectorAll("p")].map(p => p.textContent.trim()).filter(Boolean);
  const itens = [...temp.querySelectorAll("li")].map(li => li.textContent.trim()).filter(Boolean);
  const notas = [...temp.querySelectorAll(".note")].map(n => n.textContent.trim()).filter(Boolean);

  const partes = [];
  if(paragrafos[0]) partes.push(paragrafos[0]);
  if(itens.length){
    partes.push(itens.slice(0, 6).map(i => "• " + i).join("<br>"));
  } else if(paragrafos.length > 1){
    partes.push(paragrafos.slice(1, 3).join(" "));
  }
  if(notas[0]) partes.push("⚠️ " + notas[0]);
  return partes.join("<br><br>") || entry.html;
}

/* Temas mais próximos do que foi digitado (mesmo com pontuação baixa); completa com os populares */
function temasSugeridos(qNorm, max){
  const corr = corrigirConsulta(qNorm).texto;
  const ids = KNOWLEDGE_BASE.map(e => scoreEntry(e, corr)).filter(x => x.total > 0)
    .sort((a,b)=>b.total-a.total).map(x => x.entry.id);
  sugestoesParecidas(qNorm).forEach(x => { if(!ids.includes(x.entry.id)) ids.push(x.entry.id); });
  TEMAS_POPULARES.forEach(id => { if(!ids.includes(id)) ids.push(id); });
  return ids.slice(0, max);
}

/* Temas relacionados a um assunto (palavras em comum nas palavras-chave) */
function temasRelacionados(entry, max){
  const pal = e => new Set(e.keywords.flatMap(k => normalize(k).split(" ")).filter(w => w.length > 3 && !STOPWORDS.has(w) && !PALAVRAS_GENERICAS.has(w)));
  const base = pal(entry);
  return KNOWLEDGE_BASE.filter(e => e.id !== entry.id).map(e => {
    let comuns = 0; pal(e).forEach(w => { if(base.has(w)) comuns++; });
    return { e, comuns: comuns + (e.category === entry.category ? 0.5 : 0) };
  }).filter(x => x.comuns >= 1).sort((a,b)=>b.comuns-a.comuns).slice(0, max).map(x => x.e.id);
}

  box.querySelectorAll(".action-chip").forEach(btn => btn.addEventListener("click", ()=>{
    const act = btn.dataset.act;
    if(act === "ok"){ box.remove(); addBotBubble(pick(THANKS_REPLIES)); }
    else if(act === "again"){ box.remove(); ask("não entendi"); }
    else { const en = KNOWLEDGE_BASE.find(e => e.id === btn.dataset.id); if(en){ box.remove(); ask(en.title); } }
  }));
  scrollDown();
}

function greetingReply(){
  addBotBubble(pick(GREETING_REPLIES) + `<p class="fuzzy-note" style="margin-top:10px">Comece por aqui ou digite sua dúvida:</p>` + chipsTemas(TEMAS_POPULARES.slice(0,6)));
}
function thanksReply(){ addBotBubble(pick(THANKS_REPLIES)); }
function onlyThisReply(){ addBotBubble(pick(ONLY_THIS_REPLIES)); }

function confusionReply(){
  if(lastEntry){
    const content = explicarDeOutroJeito(lastEntry);
    addBotBubble(`<span class="rephrase-tag">Explicando de outro jeito</span><br>${content}`);
  } else {
    addBotBubble("Sem problema! Me diz qual processo você quer entender (ex.: locação, venda, transferência, bonificação) que eu explico com calma. Também dá pra abrir a lista de processos no menu ☰.");
  }
}

function suggestOptions(candidatos, query){
  const botoes = candidatos.map(c =>
    `<button type="button" class="suggest-btn" data-id="${c.entry.id}">${escapeHtml(c.entry.title)}</button>`
  ).join("");
  addBotBubble(`Não encontrei uma resposta exata pra "<i>${escapeHtml(query)}</i>". Você quis dizer:<br><div class="suggest-list">${botoes}</div>`);
}

function missReply(query){
  const sugestoes = chipsTemas(temasSugeridos(normalize(query), 4));
  const row = document.createElement("div");
  row.className = "row miss";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="OXIBOT ADM">
    <div class="bubble-wrap">
      <div class="bubble">Hmm, ainda não sei responder essa pergunta. :(<br>
        Peça a Polly para incluir na minha base de dados essa informação.
        <div style="margin-top:10px;font-size:.82rem">Enquanto isso, talvez ajude um destes temas:</div>${sugestoes}</div>
      <div class="timestamp">OXIBOT ADM · ${timeNow()}</div>
    </div>`;
  messagesEl.appendChild(row);
  initSuggestButtons(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot typing-row";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="OXIBOT ADM">
    <div class="bubble-wrap"><div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

function ask(query){
  if(!query.trim()) return;
  addUserMsg(query);
  inputEl.value = "";

  const qNorm = normalize(query);
  const typingRow = showTyping();

  setTimeout(()=>{
    typingRow.remove();
    if(matchesAny(qNorm, GREETING_PATTERNS) && qNorm.split(" ").length <= 4){ greetingReply(); return; }
    if(matchesAny(qNorm, THANKS_PATTERNS)){ thanksReply(); return; }
    if(matchesAny(qNorm, ONLY_THIS_PATTERNS) && qNorm.split(" ").length <= 5){ onlyThisReply(); return; }
    if(matchesAny(qNorm, CONFUSION_PATTERNS)){ confusionReply(); return; }

    const correcao = corrigirConsulta(qNorm);
    const textoBusca = correcao.trocas.length ? correcao.texto : query;
    const avisoTroca = correcao.trocas.length
      ? `<p class="fuzzy-note">Entendi ${correcao.trocas.map(t=>`<b>"${escapeHtml(t[0])}"</b> como <b>"${escapeHtml(t[1])}"</b>`).join(", ")}.</p>`
      : "";
    const candidatos = findAnswer(textoBusca);
    if(candidatos.length === 0){
      setActiveTopic(null);
      const parecidos = sugestoesParecidas(qNorm);
      if(parecidos.length){ suggestOptions(parecidos, query); } else { missReply(query); }
      return;
    }

    const top = candidatos[0];
    const segundo = candidatos[1];
    // Ambíguo: existe um segundo candidato com pontuação relativamente próxima da do primeiro
    const ambiguo = segundo && segundo.total >= top.total * 0.6 && (top.total - segundo.total) <= 1;
    // Confiante: só quando não há concorrente próximo e a pontuação é minimamente relevante
    const confiante = !ambiguo && top.total >= 0.8;

    if(confiante){
      lastEntry = top.entry;
      setActiveTopic(top.entry.id);
      const avisoCorrecao = top.exactScore === 0
        ? `<p class="fuzzy-note">Entendi como <b>"${escapeHtml(top.entry.title)}"</b> — se não for isso, me diga.</p>`
        : "";
      addBotBubble(avisoTroca + avisoCorrecao + top.entry.html);
      addFollowUps(top.entry);
    } else if(top.total >= 0.6){
      setActiveTopic(null);
      suggestOptions(candidatos.slice(0, 3), query);
    } else {
      setActiveTopic(null);
      const parecidos = sugestoesParecidas(qNorm);
      if(parecidos.length){ suggestOptions(parecidos, query); } else { missReply(query); }
    }
  }, 450);
}

const liveEl = document.getElementById("liveSuggest");
function esconderLive(){ liveEl.classList.remove("show"); liveEl.innerHTML = ""; }
inputEl.addEventListener("input", ()=>{
  const q = normalize(inputEl.value);
  if(q.length < 2){ esconderLive(); return; }
  const corr = corrigirConsulta(q).texto;
  const ids = findAnswer(corr).slice(0, 4).map(x => x.entry.id);
  if(!ids.length){ esconderLive(); return; }
  liveEl.innerHTML = `<span class="lbl">Sugestões:</span>` + chipsTemas(ids).replace('<div class="suggest-list">','').replace(/<\/div>$/,'');
  liveEl.classList.add("show");
  initSuggestButtons(liveEl);
});
liveEl.addEventListener("click", e=>{ if(e.target.closest(".suggest-btn")) esconderLive(); });

formEl.addEventListener("submit", e=>{ e.preventDefault(); esconderLive(); ask(inputEl.value); });

document.getElementById("clearBtn").addEventListener("click", ()=>{
  messagesEl.innerHTML = "";
  lastEntry = null;
  setActiveTopic(null);
  esconderLive();
  inputEl.value = "";
  greetingReply();
});

/* Tema claro/escuro (a preferência é lembrada neste navegador, se possível) */
const themeBtn = document.getElementById("themeBtn");
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
}
let temaInicial = "light";
try { temaInicial = localStorage.getItem("oxibot-adm-tema") || "light"; } catch(e){}
aplicarTema(temaInicial);
themeBtn.addEventListener("click", ()=>{
  const novo = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  aplicarTema(novo);
  try { localStorage.setItem("oxibot-adm-tema", novo); } catch(e){}
});
