<style>
  :root{
    --bg:#080b14;
    --bg-grid:#0d1220;
    --navy:#101828;
    --navy-deep:#060a12;
    --teal:#00e0ff;
    --teal-soft:rgba(0,224,255,.1);
    --accent:#7c5cff;
    --paper:#0a0e1a;
    --card:#111827;
    --ink:#e6edf5;
    --ink-soft:#8b96ab;
    --line:#1e293f;
    --warn:#ffb020;
    --warn-bg:rgba(255,176,32,.1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(0,224,255,.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(124,92,255,.08), transparent 45%),
      var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:0;
  }
  .card{
    width:100%;
    max-width:none;
    height:100vh;
    max-height:none;
    background:var(--paper);
    border-radius:0;
    box-shadow:none;
    display:flex;
    overflow:hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:240px;
    flex-shrink:0;
    background:var(--navy-deep);
    color:#fff;
    display:flex;
    flex-direction:column;
    padding:22px 0;
    border-right:1px solid var(--line);
  }
  .sidebar-brand{
    padding:0 18px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .sidebar-brand img{
    width:52px;height:52px;border-radius:50%;
    display:block; margin-bottom:10px;
    border:2px solid rgba(0,224,255,.35);
    box-shadow:0 0 14px rgba(0,224,255,.4);
  }
  .sidebar-brand .name{
    font-family:'Outfit', sans-serif;
    font-size:.98rem; font-weight:700;
    background:linear-gradient(90deg,#fff,var(--teal));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sidebar-brand .role{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
  .sidebar h2{
    font-family:'Outfit', sans-serif;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--teal);
    margin:14px 18px 8px;
    font-weight:600;
  }
  .sidebar-list{
    overflow-y:auto;
    flex:1;
    min-height:0;
    padding:0 10px;
  }
  .side-btn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:2px solid transparent;
    color:var(--ink-soft);
    padding:9px 10px;
    border-radius:8px;
    font-size:.79rem;
    cursor:pointer;
    margin-bottom:2px;
    line-height:1.3;
    transition:all .15s ease;
  }
  .side-btn:hover{background:var(--teal-soft); color:var(--ink); border-left:2px solid var(--teal);}

  @media (max-width:640px){
    .sidebar{
      position:fixed;
      left:0; top:0; bottom:0;
      z-index:20;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:10px 0 30px rgba(0,0,0,.5);
    }
    .sidebar.open{transform:translateX(0);}
    .card{max-width:100%; height:100vh; max-height:none; border-radius:0;}
    body{padding:0;}
  }

  /* ===== Chat column ===== */
  .chat-col{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:var(--paper);
  }
  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--teal);
    box-shadow:0 1px 24px rgba(0,224,255,.25);
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--teal), var(--accent), transparent);
  }
  .menu-btn{
    display:none;
    background:var(--teal-soft);
    border:1px solid rgba(0,224,255,.3);
    color:var(--teal);
    width:34px;height:34px;
    border-radius:9px;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
  }
  @media (max-width:640px){ .menu-btn{display:block;} }
  .avatar-img{
    width:42px;height:42px;
    border-radius:50%;
    border:2px solid rgba(0,224,255,.5);
    box-shadow:0 0 12px rgba(0,224,255,.5);
    flex-shrink:0;
  }
  .header-text{flex:1; min-width:0;}
  header h1{
    margin:0;
    font-family:'Outfit', sans-serif;
    font-size:1.2rem;
    font-weight:600;
    background:linear-gradient(90deg,#fff,var(--teal));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:.78rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .status .dot{width:7px;height:7px;border-radius:50%; background:var(--teal); box-shadow:0 0 6px var(--teal); display:inline-block;}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:20px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 10% 15%, rgba(0,224,255,.05) 0, rgba(0,224,255,.05) 4px, transparent 5px),
      radial-gradient(circle at 70% 8%, rgba(124,92,255,.05) 0, rgba(124,92,255,.05) 5px, transparent 6px),
      radial-gradient(circle at 85% 60%, rgba(0,224,255,.05) 0, rgba(0,224,255,.05) 3px, transparent 4px),
      radial-gradient(circle at 25% 75%, rgba(124,92,255,.05) 0, rgba(124,92,255,.05) 4px, transparent 5px),
      radial-gradient(circle at 50% 40%, rgba(0,224,255,.04) 0, rgba(0,224,255,.04) 3px, transparent 4px),
      radial-gradient(circle at 5% 55%, rgba(124,92,255,.05) 0, rgba(124,92,255,.05) 4px, transparent 5px);
    background-size:170px 170px;
    background-repeat:repeat;
  }
  .row{display:flex; align-items:flex-end; gap:8px; margin:7px 0;}
  .row.user{justify-content:flex-end;}
  .row .mini-avatar{
    width:28px;height:28px;
    border-radius:50%;
    flex-shrink:0;
    border:1.5px solid var(--navy-deep);
    box-shadow:0 0 8px rgba(0,224,255,.4);
  }
  .row.miss .mini-avatar{filter:saturate(.4) hue-rotate(-25deg);}
  .bubble-wrap{display:flex; flex-direction:column; max-width:76%;}
  .row.user .bubble-wrap{align-items:flex-end;}
  .bubble{
    padding:12px 15px;
    border-radius:17px;
    font-size:.91rem;
    line-height:1.55;
  }
  .row.bot .bubble{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .row.miss .bubble{background:#1a0f16; border:1px solid #4a1f2c; color:#ff8fa3; border-bottom-left-radius:5px;}
  .row.user .bubble{background:linear-gradient(135deg, var(--teal), var(--accent)); color:#04101a; font-weight:500; border-bottom-right-radius:5px; box-shadow:0 2px 10px rgba(0,224,255,.25);}
  .timestamp{font-size:.68rem; color:var(--ink-soft); margin-top:4px; padding:0 4px;}

  .bubble h3{margin:0 0 6px; font-family:'Outfit', sans-serif; font-size:.95rem; font-weight:600; color:var(--teal);}
  .bubble ol, .bubble ul{margin:6px 0; padding-left:20px;}
  .bubble .note{
    margin-top:8px; padding:8px 10px;
    background:var(--warn-bg); color:var(--warn);
    border-radius:8px; font-size:.82rem;
    border:1px solid rgba(255,176,32,.25);
  }
  .bubble .tag, .bubble .rephrase-tag{
    display:inline-block; font-size:.72rem; font-weight:700;
    color:var(--teal); background:var(--teal-soft);
    padding:2px 9px; border-radius:20px; margin-bottom:8px;
    border:1px solid rgba(0,224,255,.3);
  }
  .typing-row .bubble{display:flex; gap:4px; align-items:center; padding:12px 16px;}
  .typing-dot{width:6px;height:6px;border-radius:50%; background:var(--teal); animation:blink 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  form{
    display:flex; gap:8px;
    padding:14px 18px;
    border-top:1px solid var(--line);
    background:var(--navy-deep);
  }
  input[type=text]{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:22px; padding:11px 16px; font-size:.9rem; outline:none;
  }
  input[type=text]::placeholder{color:var(--ink-soft);}
  input[type=text]:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,224,255,.15);}
  button.send{
    width:42px; height:42px; background:linear-gradient(135deg, var(--teal), var(--accent)); color:#04101a;
    border:none; border-radius:50%; font-size:1.05rem; cursor:pointer; flex-shrink:0;
    box-shadow:0 4px 14px rgba(0,224,255,.25);
  }
  button.send:hover{filter:brightness(1.1);}

  .mini-calc{
    margin-top:10px;
    padding:12px;
    background:var(--navy-deep);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .mini-calc label{
    display:block;
    font-size:.78rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .mini-calc label:last-of-type{margin-bottom:12px;}
  .mini-calc input{
    display:block;
    width:100%;
    margin-top:4px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:8px;
    padding:8px 10px;
    font-size:.85rem;
    outline:none;
  }
  .mini-calc input:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,224,255,.15);}
  .mini-calc .calc-btn{
    background:linear-gradient(135deg, var(--teal), var(--accent));
    color:#04101a;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:.83rem;
    font-weight:700;
    cursor:pointer;
  }
  .mini-calc .calc-btn:hover{filter:brightness(1.1);}
  .mini-calc .calc-error{
    margin-top:8px;
    color:#ff8fa3;
    font-size:.82rem;
  }
  .overlay{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:15;
  }
  .overlay.show{display:block;}
</style>

<script>
const KNOWLEDGE_BASE = [
  {
    id: "transferencias-700-701",
    title: "Transferências no Sankhya (TOP 700 x TOP 701)",
    keywords: ["transferencia","transferência","top 700","top 701","transferir equipamento",
      "movimentacao interna","movimentação interna","entre unidades","entre locais","matriz domiciliar"],
    html: `
      <span class="tag">Transferências — Sankhya</span>
      <h3>TOP 700 x TOP 701</h3>
      <p>Existem duas TOPs para transferência de equipamentos:</p>
      <ul>
        <li><b>TOP 700 – Transferência entre Locais:</b> usada quando os dois locais são tratados pelo sistema como a <b>mesma unidade</b>, mesmo sendo endereços físicos diferentes.<br>
          Exemplos: Matriz VR ↔ Domiciliar RJ · Matriz VR ↔ Domiciliar VR · Matriz VR ↔ Assistência Técnica.</li>
        <li><b>TOP 701 – Transferência entre Unidades:</b> usada quando os locais são unidades distintas no sistema.<br>
          Exemplos: Matriz SP ↔ Domiciliar SP · Domiciliar SP ↔ Matriz SP.</li>
      </ul>
      <h3>Passo a passo (Portal de Movimentações Internas)</h3>
      <ol>
        <li>Clicar em "+" → selecionar <b>701 – Transferência entre empresas</b>.</li>
        <li>Aba <b>Cabeçalho</b>: preencher Empresa Origem, Empresa Destino, Série da nota (sempre 01), Natureza (produto de locação / venda / conserto) e Centro de Resultado (unidade que está enviando).</li>
        <li>Dar o check.</li>
        <li>Aba <b>Itens</b>: inserir produto, quantidade, local origem e local destino.</li>
        <li>Dar o check.</li>
        <li>Clicar em número de série e selecioná-lo.</li>
        <li>Fechar a tela e dar o check.</li>
        <li>Confirmar a nota.</li>
      </ol>
      <p><b>Se for TOP 700:</b> no cabeçalho, todas as empresas ficam com o código 1 — a diferença entre origem e destino é definida só na aba Itens. O restante do passo a passo segue igual.</p>
      <div class="note">Sempre que houver transferência de itens de venda da Matriz para o Carro Domiciliar (inclusive Pulmonair), é obrigatório emitir também uma Nota Fiscal adicional pela TOP 2525 — pergunte sobre "remessa para venda domiciliar" para ver esse passo a passo.</div>
    `
  },
  {
    id: "remessa-venda-domiciliar-2525",
    title: "Remessa para Venda Domiciliar (TOP 2525)",
    keywords: ["top 2525","remessa","venda domiciliar","nota fiscal adicional","carro domiciliar",
      "representante domiciliar","nota para o representante"],
    html: `
      <span class="tag">Faturamento</span>
      <h3>Remessa para Venda Domiciliar — TOP 2525</h3>
      <p>Obrigatória sempre que um item de venda for transferido da Matriz para o Carro Domiciliar (vale também para Domiciliares da Pulmonair).</p>
      <h3>Aba Cabeçalho</h3>
      <ul>
        <li>Série: 1</li>
        <li>Parceiro: Matriz</li>

/* ========================= CALCULADORA DE CANCELAMENTO DE PLANO ========================= */
function formatarMoeda(valor){
  return "R$ " + valor.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseValorMonetario(str){
  // Aceita "1200,00", "1200.00", "1.200,00" — sempre tratando vírgula como decimal quando presente
  const limpo = str.trim().replace(/\s/g,"");
  if(limpo.includes(",")){
    return parseFloat(limpo.replace(/\./g,"").replace(",", "."));
  }
  return parseFloat(limpo);
}

function mesesEntreDatas(inicio, fim){
  let meses = (fim.getFullYear() - inicio.getFullYear()) * 12 + (fim.getMonth() - inicio.getMonth());
  if(fim.getDate() < inicio.getDate()) meses -= 1;
  return Math.max(0, meses);
}

function explicarContagemMeses(inicio, fim, mesesUsados){
  const fmt = d => d.toLocaleDateString("pt-BR");
  const diaInicio = inicio.getDate();
  const diaFim = fim.getDate();
  const mesesCalendario = (fim.getFullYear() - inicio.getFullYear()) * 12 + (fim.getMonth() - inicio.getMonth());
  const plural = n => n === 1 ? "mês" : "meses";
  const viradas = n => n === 1 ? "1 virada de mês" : `${n} viradas de mês`;

  if(diaFim >= diaInicio){
    return `Contamos <b>${mesesUsados} ${plural(mesesUsados)}</b> porque cada mês do plano "fecha" sempre no dia <b>${diaInicio}</b> (o mesmo dia do início, ${fmt(inicio)}). Entre ${fmt(inicio)} e ${fmt(fim)} houve ${viradas(mesesCalendario)}, e como o dia final (${diaFim}) já alcançou o dia ${diaInicio}, esse último mês também fechou completo — por isso o total é ${mesesUsados}.`;
  }
  return `Contamos <b>${mesesUsados} ${plural(mesesUsados)}</b> porque cada mês do plano "fecha" sempre no dia <b>${diaInicio}</b> (o mesmo dia do início, ${fmt(inicio)}). Entre ${fmt(inicio)} e ${fmt(fim)} houve ${viradas(mesesCalendario)}, mas o dia final (${diaFim}) ainda não chegou no dia ${diaInicio} desse último mês — ou seja, esse último mês começou mas não fechou um ciclo completo, então ele não entra na contagem. Por isso o total é ${mesesUsados}.`;
}

function calcularRompimento(btn){
  const wrap = btn.closest(".mini-calc");
  const mesesPlano = parseInt(wrap.querySelector(".c-meses-plano").value, 10);
  const valorTotal = parseValorMonetario(wrap.querySelector(".c-valor-total").value || "");
  const dataInicioStr = wrap.querySelector(".c-data-inicio").value;
  const dataFimStr = wrap.querySelector(".c-data-fim").value;

  let erroEl = wrap.querySelector(".calc-error");
  if(erroEl) erroEl.remove();

  function mostrarErro(msg){
    const e = document.createElement("div");
    e.className = "calc-error";
    e.textContent = msg;
    wrap.appendChild(e);
  }

  if(!mesesPlano || mesesPlano <= 0){ mostrarErro("Informe quantos meses tem o plano."); return; }
  if(!valorTotal || isNaN(valorTotal) || valorTotal <= 0){ mostrarErro("Informe o valor total do plano."); return; }
  if(!dataInicioStr || !dataFimStr){ mostrarErro("Informe as duas datas (início e finalização)."); return; }

  const dataInicio = new Date(dataInicioStr + "T00:00:00");
  const dataFim = new Date(dataFimStr + "T00:00:00");
  if(dataFim < dataInicio){ mostrarErro("A data de finalização não pode ser anterior à data de início."); return; }

  const mesesUsados = mesesEntreDatas(dataInicio, dataFim);

  if(mesesUsados > mesesPlano){
    addBotBubble(`<span class="tag">Cálculo de Multa</span><br>Erro: os meses utilizados (${mesesUsados}) não podem ser maiores que o total do plano (${mesesPlano}).`);
    return;
  }

  const valorMensal = valorTotal / mesesPlano;
  const mensalidadesUtilizadas = valorMensal * mesesUsados;
  const mensalidadesRestantes = valorTotal - mensalidadesUtilizadas;
  const multa = mensalidadesRestantes * 0.3;
  const valorDevolvido = valorTotal - multa - mensalidadesUtilizadas;

  addBotBubble(`
    <span class="tag">Cálculo de Multa</span>
    <h3>Resultado do Cancelamento</h3>
    <p>Meses utilizados (calculado pelas datas): <b>${mesesUsados}</b> de <b>${mesesPlano}</b> meses do plano.</p>
    <div class="note">${explicarContagemMeses(dataInicio, dataFim, mesesUsados)}</div>
    <ul>
      <li>Mensalidades utilizadas = <b>${formatarMoeda(mensalidadesUtilizadas)}</b></li>
      <li>Mensalidades restantes = <b>${formatarMoeda(mensalidadesRestantes)}</b></li>
      <li>Multa (30% em cima do restante) = <b>${formatarMoeda(multa)}</b></li>
      <li>Valor pago: <b>${formatarMoeda(valorTotal)}</b></li>
    </ul>
    <div class="note">Valor a ser devolvido = valor pago − multa − mensalidades utilizadas<br>
      <b>Valor a ser devolvido = ${formatarMoeda(valorDevolvido)}</b></div>
  `);
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function matchesAny(qNorm, list){
  return list.some(p => qNorm.includes(normalize(p)));
}
function scoreEntry(entry, queryNorm){
  let score = 0;
  for(const kw of entry.keywords){
    const kwNorm = normalize(kw);
    if(!kwNorm) continue;
    if(queryNorm.includes(kwNorm)){
      score += kwNorm.split(" ").length * 3;
    } else {
      const words = kwNorm.split(" ");
      const hits = words.filter(w => w.length > 2 && queryNorm.includes(w)).length;
      score += hits;
    }
  }
  const titleNorm = normalize(entry.title);
  titleNorm.split(" ").forEach(w=>{ if(w.length>3 && queryNorm.includes(w)) score += 1; });
  return score;
}
function findAnswer(query){
  const qNorm = normalize(query);
  let best = null, bestScore = 0;
  for(const entry of KNOWLEDGE_BASE){
    const s = scoreEntry(entry, qNorm);
    if(s > bestScore){ bestScore = s; best = entry; }
  }
  return bestScore >= 2 ? best : null;
}

    const cat = entry.category || "Processos no Sankhya";
    if(!categories.has(cat)) categories.set(cat, []);
    categories.get(cat).push(entry);
  });

  categories.forEach((entries, cat)=>{
    const h = document.createElement("h2");
    h.textContent = cat;
    topicsInner.appendChild(h);

    entries.forEach(entry=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "side-btn";
      b.textContent = entry.title;
      b.onclick = ()=>{ sidebar.classList.remove("open"); overlay.classList.remove("show"); ask(entry.title); };
      topicsInner.appendChild(b);
    });
  });
}
renderTopics();

function scrollDown(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function timeNow(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function addUserMsg(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble-wrap">
      <div class="bubble"></div>
      <div class="timestamp">${timeNow()}</div>
    </div>`;
  row.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(row);
  scrollDown();
}

function addBotBubble(innerHtml, kind){
  const row = document.createElement("div");
  row.className = "row " + (kind || "bot");
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot ADM">
    <div class="bubble-wrap">
      <div class="bubble">${innerHtml}</div>
      <div class="timestamp">Oxibot ADM · ${timeNow()}</div>
    </div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function greetingReply(){ addBotBubble(pick(GREETING_REPLIES)); }
function thanksReply(){ addBotBubble(pick(THANKS_REPLIES)); }
function onlyThisReply(){ addBotBubble(pick(ONLY_THIS_REPLIES)); }

function confusionReply(){
  if(lastEntry){
    const content = lastEntry.simple ? lastEntry.simple : lastEntry.html;
    addBotBubble(`<span class="rephrase-tag">Explicando de outro jeito</span><br>${content}`);
  } else {
    addBotBubble("Sem problema! Me diz qual processo você quer entender (ex: locação, venda, transferência, bonificação) que eu explico com calma. Também dá pra abrir a lista de processos no menu ☰.");
  }
}

function missReply(query){
  const row = document.createElement("div");
  row.className = "row miss";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot ADM">
    <div class="bubble-wrap">
      <div class="bubble">Hmm, ainda não sei responder essa pergunta. :(<br>
        Peça a Polly para incluir na minha base de dados essa informação.</div>
      <div class="timestamp">Oxibot ADM · ${timeNow()}</div>
    </div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot typing-row";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot ADM">
    <div class="bubble-wrap"><div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

function ask(query){
  if(!query.trim()) return;
  addUserMsg(query);
  inputEl.value = "";

  const qNorm = normalize(query);
  const typingRow = showTyping();

  setTimeout(()=>{
    typingRow.remove();
    if(matchesAny(qNorm, GREETING_PATTERNS) && qNorm.split(" ").length <= 4){ greetingReply(); return; }
    if(matchesAny(qNorm, THANKS_PATTERNS)){ thanksReply(); return; }
    if(matchesAny(qNorm, ONLY_THIS_PATTERNS) && qNorm.split(" ").length <= 5){ onlyThisReply(); return; }
    if(matchesAny(qNorm, CONFUSION_PATTERNS)){ confusionReply(); return; }

    const match = findAnswer(query);
    if(match){ lastEntry = match; addBotBubble(match.html); }
    else{ missReply(query); }
  }, 450);
}

formEl.addEventListener("submit", e=>{ e.preventDefault(); ask(inputEl.value); });

greetingReply();
</script>
</body>
</html>
