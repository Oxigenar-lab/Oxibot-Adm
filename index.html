<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente de Processos — Faturamento &amp; Contratos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A4%96</text></svg>">
<style>
  :root{
    --bg:#eef2f2;
    --card:#ffffff;
    --primary:#146b66;
    --primary-dark:#0e4f4b;
    --accent-soft:#e6f2f1;
    --bot-bubble:#f3f5f6;
    --text:#1c2733;
    --text-soft:#6b7a82;
    --border:#e6eaec;
    --user-bubble:#146b66;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:24px 14px;
  }
  .card{
    width:100%;
    max-width:640px;
    height:calc(100vh - 48px);
    max-height:880px;
    background:var(--card);
    border-radius:20px;
    box-shadow:0 18px 50px rgba(15,45,42,.14);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    background:var(--primary);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar{
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
  }
  .header-text{flex:1; min-width:0;}
  header h1{
    margin:0;
    font-size:1rem;
    font-weight:600;
  }
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:.76rem;
    color:#cfe8e5;
    margin-top:2px;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;
    background:#5fe0a0;
    display:inline-block;
  }
  .topics-toggle{
    background:rgba(255,255,255,.14);
    border:none;
    color:#fff;
    font-size:.76rem;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .topics-toggle:hover{background:rgba(255,255,255,.24);}

  .topics-panel{
    max-height:0;
    overflow:hidden;
    background:var(--accent-soft);
    transition:max-height .25s ease;
    flex-shrink:0;
  }
  .topics-panel.open{max-height:160px; overflow-y:auto;}
  .topics-inner{
    padding:12px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:#fff;
    border:1px solid var(--border);
    color:var(--primary-dark);
    font-size:.78rem;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    line-height:1.2;
  }
  .chip:hover{background:var(--primary); color:#fff; border-color:var(--primary);}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:20px 18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    margin:6px 0;
  }
  .row.user{justify-content:flex-end;}
  .row .mini-avatar{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    flex-shrink:0;
  }
  .row.miss .mini-avatar{background:#b5766f;}
  .bubble{
    max-width:78%;
    padding:12px 15px;
    border-radius:16px;
    font-size:.91rem;
    line-height:1.55;
  }
  .row.bot .bubble{
    background:var(--bot-bubble);
    border-bottom-left-radius:4px;
  }
  .row.miss .bubble{
    background:#fbeeec;
    color:#7a3a30;
    border-bottom-left-radius:4px;
  }
  .row.user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble h3{
    margin:0 0 6px;
    font-size:.95rem;
    color:var(--primary-dark);
  }
  .bubble ol, .bubble ul{margin:6px 0; padding-left:20px;}
  .bubble .note{
    margin-top:8px;
    padding:8px 10px;
    background:#fff4e0;
    color:#8a5a00;
    border-radius:8px;
    font-size:.82rem;
  }
  .bubble .rephrase-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:700;
    color:var(--primary);
    background:var(--accent-soft);
    padding:2px 9px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .typing-row .bubble{
    display:flex;
    gap:4px;
    align-items:center;
    padding:12px 16px;
  }
  .typing-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-soft);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  form{
    display:flex;
    gap:8px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    background:var(--card);
  }
  input[type=text]{
    flex:1;
    border:1px solid var(--border);
    background:var(--bg);
    border-radius:22px;
    padding:11px 16px;
    font-size:.9rem;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--primary);}
  button.send{
    width:42px; height:42px;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:50%;
    font-size:1.05rem;
    cursor:pointer;
    flex-shrink:0;
  }
  button.send:hover{background:var(--primary-dark);}

  @media (max-width:480px){
    body{padding:0;}
    .card{border-radius:0; height:100vh; max-height:none;}
  }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="avatar">🤖</div>
    <div class="header-text">
      <h1>Assistente de Processos</h1>
      <div class="status"><span class="dot"></span> Setor de Solicitações · sempre disponível</div>
    </div>
    <button class="topics-toggle" id="topicsToggle" type="button">📋 Processos</button>
  </header>

  <div class="topics-panel" id="topicsPanel">
    <div class="topics-inner" id="topicsInner"></div>
  </div>

  <div class="messages" id="messages"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Digite sua dúvida..." autocomplete="off">
    <button class="send" type="submit" aria-label="Enviar">➤</button>
  </form>
</div>

<script>
/* =========================================================================
   BASE DE CONHECIMENTO
   -------------------------------------------------------------------------
   Para adicionar um novo processo, copie um bloco { ... } abaixo e edite:
     id        -> identificador único, sem espaço (ex: "novo-processo")
     title     -> título mostrado no chip do menu e na resposta
     keywords  -> palavras/expressões que o representante pode digitar
     html      -> resposta detalhada, em HTML (<ol>, <ul>, <b>, a classe
                  "note" destaca avisos importantes)
     simple    -> uma versão curta, em linguagem simples, usada quando a
                  pessoa diz que não entendeu a explicação detalhada
   Depois de editar, salve o arquivo e recarregue no navegador. Não precisa
   de mais nada — não há servidor nem banco de dados externo.
   ========================================================================= */
const KNOWLEDGE_BASE = [
  {
    id: "transferencias-700-701",
    title: "Transferências (TOP 700 x 701)",

      "movimentacao interna","movimentação interna","entre unidades","entre locais","matriz domiciliar"],
    simple: "Resumindo: TOP 700 é quando os dois locais contam como a mesma unidade no sistema (ex: Matriz VR e Domiciliar VR/RJ). TOP 701 é quando são unidades realmente diferentes (ex: Matriz SP e Domiciliar SP). Na prática: abre o Portal de Movimentações Internas, clica em \"+\", escolhe 700 ou 701, preenche empresa origem/destino e o produto, e confirma.",
    html: `
      <h3>TOP 700 x TOP 701</h3>
      <p>Existem duas TOPs para transferência de equipamentos:</p>

        <li><b>TOP 700 – Transferência entre Locais:</b> usada quando os dois locais são tratados pelo sistema como a <b>mesma unidade</b>, mesmo sendo endereços físicos diferentes.<br>
          Exemplos: Matriz VR ↔ Domiciliar RJ · Matriz VR ↔ Domiciliar VR · Matriz VR ↔ Assistência Técnica.</li>
        <li><b>TOP 701 – Transferência entre Unidades:</b> usada quando os locais são unidades distintas no sistema.<br>
          Exemplos: Matriz SP ↔ Domiciliar SP · Domiciliar SP ↔ Matriz SP.</li>
      </ul>
      <h3>Passo a passo (Portal de Movimentações Internas)</h3>
      <ol>
        <li>Clicar em "+" → selecionar <b>701 – Transferência entre empresas</b>.</li>
        <li>Aba <b>Cabeçalho</b>: preencher Empresa Origem, Empresa Destino, Série da nota (sempre 01), Natureza (produto de locação / venda / conserto) e Centro de Resultado (unidade que está enviando).</li>
        <li>Dar o check.</li>
        <li>Aba <b>Itens</b>: inserir produto, quantidade, local origem e local destino.</li>
        <li>Dar o check.</li>
        <li>Clicar em número de série e selecioná-lo.</li>
        <li>Fechar a tela e dar o check.</li>
        <li>Confirmar a nota.</li>
      </ol>
      <p><b>Se for TOP 700:</b> no cabeçalho, todas as empresas ficam com o código 1 — a diferença entre origem e destino é definida só na aba Itens. O restante do passo a passo segue igual.</p>
      <div class="note">Sempre que houver transferência de itens de venda da Matriz para o Carro Domiciliar (inclusive Pulmonair), é obrigatório emitir também uma Nota Fiscal adicional pela TOP 2525 — pergunte sobre "remessa para venda domiciliar" para ver esse passo a passo.</div>

/* ========================= DETECÇÃO DE INTENÇÃO ========================= */
const CONFUSION_PATTERNS = [
  "nao entendi","não entendi","nao entendo","não entendo","nao ficou claro","não ficou claro",
  "explica de outro jeito","explica diferente","de outra forma","mais simples","nao captei",
  "não captei","confuso","complicado","nao saquei","não saquei","resume","resumindo",
  "pode simplificar","fica dificil","fica difícil","nao entendi nada","não entendi nada"
];
const GREETING_PATTERNS = ["oi","ola","olá","bom dia","boa tarde","boa noite","opa","eae","e ai","e aí"];
const THANKS_PATTERNS = ["obrigado","obrigada","valeu","vlw","top obrigado","ajudou","show"];
const ONLY_THIS_PATTERNS = ["so isso","só isso","e so isso","é só isso","isso mesmo","so isso mesmo",
  "só isso mesmo","é isso","e isso","era so isso","era só isso","nada mais","so isso ai","só isso aí"];

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}

function matchesAny(qNorm, list){
  return list.some(p => qNorm.includes(normalize(p)));
}

function scoreEntry(entry, queryNorm){
  let score = 0;
  for(const kw of entry.keywords){
    const kwNorm = normalize(kw);
    if(!kwNorm) continue;
    if(queryNorm.includes(kwNorm)){
      score += kwNorm.split(" ").length * 3;
    } else {
      const words = kwNorm.split(" ");
      const hits = words.filter(w => w.length > 2 && queryNorm.includes(w)).length;
      score += hits;
    }
  }
  const titleNorm = normalize(entry.title);
  titleNorm.split(" ").forEach(w=>{
    if(w.length>3 && queryNorm.includes(w)) score += 1;
  });
  return score;
}

function findAnswer(query){
  const qNorm = normalize(query);
  let best = null, bestScore = 0;
  for(const entry of KNOWLEDGE_BASE){
    const s = scoreEntry(entry, qNorm);
    if(s > bestScore){ bestScore = s; best = entry; }
  }
  return bestScore >= 2 ? best : null;
}

/* ========================= ESTADO DA CONVERSA ========================= */
let lastEntry = null;

/* ========================= INTERFACE ========================= */
const messagesEl = document.getElementById("messages");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");
const topicsInner = document.getElementById("topicsInner");
const topicsPanel = document.getElementById("topicsPanel");
const topicsToggle = document.getElementById("topicsToggle");

topicsToggle.addEventListener("click", ()=>{
  topicsPanel.classList.toggle("open");
});

function renderTopics(){
  KNOWLEDGE_BASE.forEach(entry=>{
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = entry.title;
    chip.onclick = ()=>{ topicsPanel.classList.remove("open"); ask(entry.title); };
    topicsInner.appendChild(chip);
  });
}
renderTopics();

function scrollDown(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addUserMsg(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble"></div>`;
  row.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(row);
  scrollDown();
}

function addBotBubble(innerHtml, kind){
  const row = document.createElement("div");
  row.className = "row " + (kind || "bot");
  row.innerHTML = `<div class="mini-avatar">🤖</div><div class="bubble">${innerHtml}</div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function greetingReply(){
  addBotBubble("Oi! Pode perguntar sobre transferências no Sankhya, emissão de nota, higienização ou qualquer processo de faturamento. Se eu não souber algo, eu aviso — assim dá pra ir completando a base aos poucos.");
}

function thanksReply(){
  addBotBubble("Disponha! Se aparecer outra dúvida sobre os processos, é só chamar.");
}

function onlyThisReply(){
  addBotBubble("Sim, é isso mesmo! 😊 Como posso te ajudar hoje?");
}

function confusionReply(){
  if(lastEntry){
    addBotBubble(`<span class="rephrase-tag">Explicando de outro jeito</span><br>${lastEntry.simple}`);
  } else {
    addBotBubble("Sem problema! Me diz qual processo você quer entender (ex: transferência, higienização, nota com frete) que eu explico com calma. Também dá pra abrir a lista em \"📋 Processos\" ali em cima.");
  }
}

function missReply(query){
  const row = document.createElement("div");
  row.className = "row miss";
  row.innerHTML = `<div class="mini-avatar">🤖</div>
    <div class="bubble">Ainda não tenho essa informação na base 🙁<br>
    Pergunta: <i>"${query.replace(/</g,"&lt;")}"</i><br><br>
    Peça pra incluir esse processo na base de conhecimento (é só adicionar um bloco no arquivo) e eu já respondo da próxima vez.</div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot typing-row";
  row.innerHTML = `<div class="mini-avatar">🤖</div>
    <div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

function ask(query){
  if(!query.trim()) return;
  addUserMsg(query);
  inputEl.value = "";

  const qNorm = normalize(query);
  const typingRow = showTyping();

  setTimeout(()=>{
    typingRow.remove();

    if(matchesAny(qNorm, GREETING_PATTERNS) && qNorm.split(" ").length <= 4){
      greetingReply();
      return;
    }
    if(matchesAny(qNorm, THANKS_PATTERNS)){
      thanksReply();
      return;
    }
    if(matchesAny(qNorm, ONLY_THIS_PATTERNS) && qNorm.split(" ").length <= 5){
      onlyThisReply();
      return;
    }
    if(matchesAny(qNorm, CONFUSION_PATTERNS)){
      confusionReply();
      return;
    }

    const match = findAnswer(query);
    if(match){
      lastEntry = match;
      addBotBubble(match.html);
    } else {
      missReply(query);
    }
  }, 400);
}

formEl.addEventListener("submit", e=>{
  e.preventDefault();
  ask(inputEl.value);
});

greetingReply();
</script>
